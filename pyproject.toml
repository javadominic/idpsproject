[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "services", "idps_platform"]

[project]
name = "idps"
version = "1.0.0"
description = "Enterprise Intrusion Detection & Prevention System — Modular, Scalable, Secure, Observable"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    # Async & Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",

    # Message Bus
    "aiokafka>=0.11.0",

    # Database & Storage
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "clickhouse-connect>=0.7.0",
    "redis[hiredis]>=5.0.0",

    # Data Models & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.0",
    "eval-type-backport>=0.2.0",

    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",

    # Security & Auth
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",

    # ML & Analysis
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",

    # Network & Packet Analysis
    "scapy>=2.6.0",
    "dpkt>=1.9.0",

    # Utilities
    "croniter>=3.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
    "xxhash>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
    "testcontainers>=4.8.0",
    "faker>=30.0.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
